  <title>Лаянье — CatWar</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #d8cfbf;
      font-family: Arial, sans-serif;
    }
    .site-shell {
      width: min(100vw, calc(100vh * 1000 / 813));
      aspect-ratio: 1000 / 813;
      position: relative;
      flex: none;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .layer {
      position: absolute;
      display: none;
      pointer-events: none;
    }
    .layer.visible { display: block; }
    button.layer { border: 0; padding: 0; background: transparent; }
    button.layer.visible { pointer-events: auto; cursor: pointer; }
    .layer img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
    }
    .clickable {
      position: absolute;
      display: block;
      z-index: 100;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
      text-decoration: none;
      color: transparent;
      font-size: 0;
      line-height: 0;
    }
     /* ===== Подчёркивание для ссылок с классом .ul ===== */
    .ul::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: var(--ul-bottom, -2px);
      width: var(--ul-width, 100%);
      height: var(--ul-height, 2px);
      background: var(--ul-color, #cfbd98);
      border-radius: 2px;
      opacity: .85;
      pointer-events: none;
      transition: opacity .15s ease;
    }
    .ul:hover::after {
      opacity: 1;
    }
    button.clickable { appearance: none; }
    .rotate { transform-origin: center; }
    .audio-progress {
      position: absolute;
      z-index: 90;
      display: none;
      accent-color: #cfbd98;
      width: 15.47%;
      left: 54.2%;
      top: 71.1%;
    }
    .audio-progress.visible { display: block; }
    .audio-progress input {
      width: 100%;
      margin: 0;
      cursor: pointer;
    }
    .debug .clickable { outline: 1px solid rgba(255,0,0,.55); background: rgba(255,0,0,.08); }
    @media (max-aspect-ratio: 1000/813) {
      body { align-items: start; }
      .site-shell { width: 100vw; }
    }
  </style>
</head>

  <script>
    (() => {
      const site = document.getElementById('site');
      const pages = [...document.querySelectorAll('.page')];
      const allPageNames = pages.map(el => el.dataset.page);
      let currentPage = 'main';

      const isHistory = page => page.startsWith('history');
      const show = (el, on) => el.classList.toggle('visible', !!on);

      function setPage(page, pushHash = true) {
        if (!allPageNames.includes(page)) page = 'main';
        currentPage = page;

        pages.forEach(el => show(el, el.dataset.page === page));
        document.querySelectorAll('.always').forEach(el => show(el, true));
        document.querySelectorAll('.only-main').forEach(el => show(el, page === 'main'));
        document.querySelectorAll('.only-main-click').forEach(el => el.style.display = page === 'main' ? 'block' : 'none');
        document.querySelectorAll('.always-click').forEach(el => el.style.display = 'block');

        document.querySelectorAll('.active-tab').forEach(el => {
          if (el.classList.contains('history-active')) show(el, isHistory(page));
          else show(el, el.dataset.for === page);
        });

        document.querySelectorAll('.right-tab').forEach(el => {
          const allowed = (el.dataset.show || '').split(',');
          show(el, allowed.includes(page));
        });

        show(document.querySelector('.left-home'), page !== 'main');
        show(document.querySelector('.lore-left'), ['character','appearance','history1','history2','history3'].includes(page));
        show(document.querySelector('.character-left'), ['appearance','history1','history2','history3'].includes(page));
        show(document.querySelector('.appearance-left'), isHistory(page));

        document.querySelectorAll('.inner-tab-click').forEach(el => {
          el.style.display = (el.dataset.pages || '').split(',').includes(page) ? 'block' : 'none';
        });

        document.querySelectorAll('.history-nav').forEach(el => {
          const allowed = (el.dataset.show || '').split(',');
          show(el, allowed.includes(page));
        });

        const audioPlay = document.getElementById('audioPlay');
        const audioProgressWrap = document.getElementById('audioProgressWrap');
        show(audioPlay, page === 'character');
        audioProgressWrap.classList.toggle('visible', page === 'character');

        if (page !== 'character') document.getElementById('audio').pause();

        if (pushHash) {
          const hash = page === 'main' ? '' : '#' + page;
          if (location.hash !== hash) history.replaceState(null, '', location.pathname + location.search + hash);
        }
      }

      document.querySelectorAll('[data-target]').forEach(el => {
        el.addEventListener('click', evt => {
          evt.preventDefault();
          setPage(el.dataset.target);
        });
      });

      document.querySelectorAll('[data-target-next-history]').forEach(el => {
        el.addEventListener('click', evt => {
          evt.preventDefault();
          if (currentPage === 'history1') setPage('history2');
          else if (currentPage === 'history2') setPage('history3');
        });
      });

      const audio = document.getElementById('audio');
      const audioPlay = document.getElementById('audioPlay');
      const progress = document.getElementById('audioProgress');

      audioPlay.addEventListener('click', () => {
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
      });
      audio.addEventListener('timeupdate', () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          progress.value = Math.round((audio.currentTime / audio.duration) * 1000);
        }
      });
      progress.addEventListener('input', () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
        }
      });

      window.addEventListener('hashchange', () => setPage(location.hash.slice(1) || 'main', false));

      // Скрытый режим проверки кликабельных областей: добавьте ?debug=1 к адресу.
      if (new URLSearchParams(location.search).get('debug') === '1') site.classList.add('debug');

      setPage(location.hash.slice(1) || 'main', false);
    })();
  </script>
</body>
</html>
